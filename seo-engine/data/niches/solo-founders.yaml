      - "Embedded analytics on shared decks beats Google Slides."
    weaknesses:
      - "Templates can feel same-y at scale — you have to override defaults."
      - "Custom domain + heavy theming locked behind Pro."
      - "Limited control vs. Figma for pixel-perfect work."
