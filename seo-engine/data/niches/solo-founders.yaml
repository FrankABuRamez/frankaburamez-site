# Niche: AI for Solo Founders
# Source of truth for the seo-engine page generator.
# Pricing and commission data current as of Jan 2026 — items lacking a confirmed
# affiliate program are marked TODO_VERIFY so a human can confirm before launch.
niche:
  slug: solo-founders
  name: AI for Solo Founders
  audience: "Non-technical founders running a one-person company who use AI as their team."
  intent: "Replace hiring with software. Cover ops, ideation, writing, and decision-making with AI."

tools:
  - name: ChatGPT
    slug: chatgpt
    category: writing
    one_liner: "General-purpose AI assistant for drafting, planning, and rapid research a solo founder can run all day."
    official_url: "https://chat.openai.com"
    affiliate_url: "https://chat.openai.com"
    pricing_tiers:
      - "Free — GPT-5 with usage caps"
      - "Plus — $20/mo"
      - "Pro — $200/mo (heavy reasoning + agents)"
      - "Team — $30/seat/mo"
    recurring_commission_pct: "TODO_VERIFY (no public consumer affiliate program as of Jan 2026)"
    strengths:
      - "Best general-purpose AI for ambiguous founder questions."
      - "Custom GPTs let a solo operator turn repeat workflows into one-click apps."
      - "Voice mode is genuinely usable for long thinking walks."
    weaknesses:
      - "No real consumer affiliate program — monetization is ads/upsell adjacent."
      - "Pro tier price is steep for early-stage solo founders."
      - "Memory and context across chats still leaks between projects."
    best_for: "Solo founders who want one tool that handles 80% of daily thinking work."
    alternative_slugs: [claude, gemini, perplexity, notion-ai]

  - name: Claude
    slug: claude
    category: writing
    one_liner: "Anthropic's AI — sharper writing, longer documents, and a Projects feature solo founders use as second-brain folders."
    official_url: "https://claude.ai"
    affiliate_url: "https://claude.ai"
    pricing_tiers:
      - "Free — Claude Sonnet with daily caps"
      - "Pro — $20/mo"
      - "Max — $100-$200/mo"
      - "Team — $25/seat/mo (5+ seats)"
    recurring_commission_pct: "TODO_VERIFY (Anthropic does not run a consumer affiliate program as of Jan 2026)"
    strengths:
      - "Better long-form writing voice than most competitors."
      - "Projects + Artifacts make it usable as a knowledge base, not just a chat."
      - "Strong code execution and computer-use tier for ops automation."
    weaknesses:
      - "No public affiliate program — pure end-user purchase."
      - "Daily message caps still bite Pro users on long days."
      - "Mobile app feature parity lags ChatGPT."
    best_for: "Founders who write a lot — newsletters, sales copy, internal docs — and want better defaults."
    alternative_slugs: [chatgpt, gemini, jasper, copy-ai]

  - name: Notion AI
    slug: notion-ai
    category: knowledge-base
    one_liner: "AI built into the workspace solo founders already use to run docs, CRM, and roadmap."
    official_url: "https://www.notion.so/product/ai"
    affiliate_url: "https://www.notion.so/product/ai"
    pricing_tiers:
      - "Free — limited AI credits"
      - "Plus — $12/seat/mo"
      - "Business — $24/seat/mo (full AI)"
      - "Enterprise — custom"
    recurring_commission_pct: "50% recurring for 12 months (TODO_VERIFY current Notion Affiliate Program terms)"
    strengths:
      - "Works inside the database/page model founders already operate from."
      - "Connects to Slack, Google Drive, and Linear for cross-app search."
      - "One of the few SaaS AI products with a real recurring affiliate program."
    weaknesses:
      - "Generation quality lags Claude/ChatGPT on long-form writing."
      - "AI features keep getting re-bundled into higher tiers."
      - "Not a fit if your knowledge base is not already in Notion."
    best_for: "Solo founders running their company in Notion who want AI inside the docs."
    alternative_slugs: [coda, mem, obsidian-ai, anytype]

  - name: Perplexity
    slug: perplexity
    category: research
    one_liner: "AI search engine that returns sourced answers, not links — solo founders use it as their default research tab."
    official_url: "https://www.perplexity.ai"
    affiliate_url: "https://www.perplexity.ai"
    pricing_tiers:
      - "Free — basic search"
      - "Pro — $20/mo"
      - "Enterprise Pro — $40/seat/mo"
      - "Max — $200/mo (extended Pro Search and labs)"
    recurring_commission_pct: "TODO_VERIFY (Perplexity has run referral credit programs but no public revenue affiliate)"
    strengths:
      - "Cited answers cut research time on competitive intel and market sizing."
      - "Pro Search runs longer, multi-step web reasoning that beats raw Google."
      - "Spaces let a founder build a project workspace around recurring questions."
    weaknesses:
      - "No published recurring revenue affiliate — monetization is referral credits."
      - "Hallucinated citations still happen on niche topics."
      - "Pricing has crept upward with each model upgrade."
    best_for: "Solo founders who research before every decision and need real sources."
    alternative_slugs: [chatgpt, you-com, exa, kagi]

